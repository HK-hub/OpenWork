services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: openwork-postgres
    environment:
      POSTGRES_USER: openwork
      POSTGRES_PASSWORD: openwork
      POSTGRES_DB: openwork
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - openwork_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwork"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  openwork_pgdata:
